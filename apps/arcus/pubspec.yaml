name: arcus
description: Arcus — offline-first professional archery calculators for Android and iOS.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  archery_engine:
    path: ../../packages/archery_engine
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  fl_chart: ^0.70.2
  # Ads behind abstraction — test IDs only until production IDs supplied.
  cupertino_icons: ^1.0.8
  material_ui: ^1.11.1
  http: ^1.6.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: false
