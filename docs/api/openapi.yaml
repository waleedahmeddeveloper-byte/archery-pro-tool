openapi: 3.0.3
info:
  title: Arcus Content Sync API
  version: 1.1.0
  description: >
    Versioned content feed for Arcus mobile clients. The website implements this
    contract; the app ships with bundled offline content and pulls updates via
    HTTPS with disk cache + retry/backoff. Set ARCUS_API_BASE at build time.
servers:
  - url: https://api.example.com/v1
    description: Replace with production host (must be HTTPS)
  - url: http://127.0.0.1:8787/v1
    description: Local mock for development only
paths:
  /manifest:
    get:
      summary: Content manifest with versions
      operationId: getManifest
      parameters:
        - in: query
          name: since
          schema:
            type: string
            format: date-time
          required: false
          description: ISO-8601 timestamp; clients may send last successful sync time
      responses:
        "200":
          description: Manifest
          headers:
            Cache-Control:
              schema:
                type: string
              description: Recommended `public, max-age=300`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manifest"
        "304":
          description: Not modified (optional If-None-Match support)
        "5XX":
          description: Server error — clients retry with exponential backoff then use cache
  /guides:
    get:
      summary: Educational guides
      operationId: listGuides
      parameters:
        - in: query
          name: updated_since
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Guide list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Guide"
  /spine-charts:
    get:
      summary: Planning spine chart updates
      operationId: listSpineCharts
      responses:
        "200":
          description: Chart payloads
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SpineChart"
  /announcements:
    get:
      summary: In-app announcements
      operationId: listAnnouncements
      responses:
        "200":
          description: Announcements
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Announcement"
components:
  schemas:
    Manifest:
      type: object
      required: [generated_at, guides_version, charts_version, announcements_version]
      properties:
        generated_at:
          type: string
          format: date-time
        guides_version:
          type: string
        charts_version:
          type: string
        announcements_version:
          type: string
    Guide:
      type: object
      required: [id, title, body_markdown, updated_at]
      properties:
        id:
          type: string
        title:
          type: string
        body_markdown:
          type: string
        updated_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
    SpineChart:
      type: object
      required: [id, name, version, bands]
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        bands:
          type: array
          items:
            type: object
            required: [max_effective_lb, spine]
            properties:
              max_effective_lb:
                type: number
              spine:
                type: integer
    Announcement:
      type: object
      required: [id, title, body, published_at]
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        published_at:
          type: string
          format: date-time
