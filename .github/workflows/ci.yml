name: ci

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Engine tests
        working-directory: packages/archery_engine
        run: |
          dart pub get
          dart test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze & test app
        working-directory: apps/arcus
        run: |
          flutter pub get
          flutter analyze
          flutter test
